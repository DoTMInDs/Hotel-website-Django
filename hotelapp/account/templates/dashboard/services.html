{% extends "partials/layout.html" %}
{% load static %}
{% block title %}{% endblock title %}
{% block main-content %}
    {% include "dashboard/partials/nav.html" %}
    <section class="w-[100%] h-screen bg-slate-300  fixed z-[1] top-0 right-0 left-0 overflow-y-auto mt-[0px] pt-[100px]">
        {% if messages %}
            <div class="w-[100%] md:w-[80%] m-auto md:px-0 px-[1rem] z-[9999] absolute top-[11%] right-[3px] ml-[0.3rem] md:ml-[300px] transition-all duration-300">
                <div id="alert-3" class="flex items-center p-4 mb-4 text-white rounded-lg {% if message.tags == 'error' %} bg-red-500{% else %} bg-green-500{% endif %}" role="alert">
                    <svg class="shrink-0 w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
                    </svg>
                    <span class="sr-only">Info</span>
                    <div class="ms-3 text-sm font-medium">
                        <div class="my-2 text-center">
                            {% for message in messages %}
                                <p class="text-white text-center">{{ message }}</p>
                            {% endfor %}
                        </div>
                    </div>
                    <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-green-50 text-green-500 rounded-lg focus:ring-2 focus:ring-green-400 p-1.5 hover:bg-green-200 inline-flex items-center justify-center h-8 w-8" data-dismiss-target="#alert-3" aria-label="Close">
                        <span class="sr-only">Close</span>
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                    </button>
                </div>
            </div>
        {% endif %}
        
    </section>
   
    
{% endblock %}

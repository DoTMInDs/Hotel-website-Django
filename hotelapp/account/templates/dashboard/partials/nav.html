  <script>
    function menuToggle() {
        const dashboard_SideBar = document.querySelector('.dashboard_SideBar');
        if (dashboard_SideBar) {
            dashboard_SideBar.classList.toggle('-translate-x-full');
            dashboard_SideBar.classList.toggle('translate-x-0');
            console.log('sidebar')
            // Optional: Prevent body scrolling when dashboard_SideBar is open
            document.body.classList.toggle('overflow-hidden');
        }
    }
    
    // Close dashboard_SideBar when clicking outside (optional)
    document.addEventListener('click', function(event) {
        const dashboard_SideBar = document.querySelector('.dashboard_SideBar');
        const menuButton = document.querySelector('[onclick="menuToggle()"]');
        
        if (dashboard_SideBar && !dashboard_SideBar.contains(event.target) && event.target !== menuButton && !menuButton.contains(event.target)) {
            if (!dashboard_SideBar.classList.contains('-translate-x-full')) {
                dashboard_SideBar.classList.add('-translate-x-full');
                dashboard_SideBar.classList.remove('translate-x-0');
                document.body.classList.remove('overflow-hidden');
            }
        }
    });

  </script>

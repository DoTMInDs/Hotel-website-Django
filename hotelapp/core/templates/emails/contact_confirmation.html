<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{font-family:Arial,Helvetica,sans-serif;color:#111}</style>
    <title>Thanks for contacting {{ site_name }}</title>
  </head>
  <body>
    <h2>Thanks, {{ lead.full_name }}!</h2>
    <p>We received your message and our team will contact you shortly.</p>
    <p><strong>Your message:</strong></p>
    <div style="background:#f7f7f7;padding:12px;border-radius:6px">{{ lead.message|linebreaksbr }}</div>
    <p style="margin-top:12px">If you need immediate assistance, please call us at {{ hotel_phone|default:'(not set)' }}.</p>
    <p style="margin-top:18px;color:#666">Warm regards,<br>{{ site_name }} Team</p>
  </body>
</html>
